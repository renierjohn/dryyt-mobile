# Smoke test: the app opens and reaches sign-in without crashing.
# Run on a booted emulator with the app installed: yarn e2e
appId: com.dryyt.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to continue"
    timeout: 20000
- assertNotVisible: "Something went wrong"
